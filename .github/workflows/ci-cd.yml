name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/auth-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/auth-frontend

jobs:

  # ── Job 1 : Build & Push images Docker 
  build:
    name:  Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2 : Tests 
  test:
    name:  Tests Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: authdb_test
          POSTGRES_USER: authuser
          POSTGRES_PASSWORD: authpass
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        working-directory: ./backend
        run: npm install

      - name: Vérifier que le backend démarre
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: authdb_test
          DB_USER: authuser
          DB_PASSWORD: authpass
          JWT_SECRET: test-secret
          PORT: 5000
        run: |
          node src/index.js &
          sleep 3
          curl --fail http://localhost:5000/health || exit 1
          echo "✅ Backend OK"

  # ── Job 3 : Deploy sur Kubernetes 
  deploy:
    name: 🚀 Deploy sur K8s Production
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.K8S_MASTER_HOST }} >> ~/.ssh/known_hosts

      - name: Déployer sur le cluster K3s
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.K8S_MASTER_HOST }} "
            cd ~/k8s && \
            sudo kubectl set image deployment/auth-backend backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} -n production && \
            sudo kubectl set image deployment/auth-frontend frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -n production && \
            sudo kubectl rollout status deployment/auth-backend -n production && \
            sudo kubectl rollout status deployment/auth-frontend -n production && \
            echo ' Déploiement terminé'
          "
