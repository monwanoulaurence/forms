---
# k8s/base/grafana-dashboard.yaml
# Dashboard Grafana sauvegardé dans Kubernetes
# Chargé automatiquement au démarrage de Grafana

apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  auth-app-dashboard.json: |
    {
      "title": "App_Monitoring",
      "uid": "devops-auth-001",
      "editable": true,
      "refresh": "10s",
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "schemaVersion": 36,
      "tags": [],
      "panels": [
        {
          "id": 1,
          "title": "Inscription totale",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [{
            "expr": "sum(app_registrations_total)",
            "legendFormat": "__auto",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "id": 2,
          "title": "Connexions réussies",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [{
            "expr": "sum(app_logins_success_total)",
            "legendFormat": "__auto",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "id": 3,
          "title": "Tentatives échouées",
          "type": "stat",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [{
            "expr": "sum(app_logins_failed_total)",
            "legendFormat": "__auto",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "id": 4,
          "title": "Utilisateurs total",
          "type": "stat",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [{
            "expr": "sum(app_users_registered_total)",
            "legendFormat": "__auto",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "id": 5,
          "title": "Requêtes par route",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [{
            "expr": "rate(app_http_request_duration_seconds_count[5m])",
            "legendFormat": "{{method}} {{route}} {{status}}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "id": 6,
          "title": "Pods actifs",
          "type": "stat",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [{
            "expr": "count(kube_pod_info{namespace=\"production\"})",
            "legendFormat": "__auto",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "id": 7,
          "title": "CPU par pod",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"production\"}[5m])) by (pod)",
            "legendFormat": "{{pod}}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "id": 8,
          "title": "RAM par pod",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [{
            "expr": "sum(container_memory_usage_bytes{namespace=\"production\", container!=\"\"}) by (pod)",
            "legendFormat": "{{pod}}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        }
      ]
    }
